<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defense-in-depth against XSS: even though the admin JWT is now an
      httpOnly cookie (unreadable by injected scripts), a CSP still stops
      an XSS bug from loading attacker-controlled scripts, exfiltrating
      data to a third-party origin, or framing this page in a clickjacking
      attack. style-src allows 'unsafe-inline' because MUI/Emotion inject
      inline <style> tags at runtime; tightening that further would
      require a nonce-based build setup.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.onrender.com http://localhost:3000; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    />
    <title>dwaar-sewa-admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
